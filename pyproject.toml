[build-system]
requires = [
  "scikit-build-core>=0.7.0",
  "pybind11>=2.11",
  "setuptools>=68",
]
build-backend = "scikit_build_core.build"

[project]
name = "pyweightedcluster"
version = "0.1.1"
description = "Python port of WeightedCluster (k-medoids and sequence utilities)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "WeightedCluster Contributors" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11.1",
  "pandas>=2.1",
  # Sequence distances, costs and the weighted discrepancy/inertia maths are
  # owned by traminex (the family's R-validated base; MIGRATION_PLAN.md
  # Phases 1-2). traminex is a LOCAL project, not on PyPI: it must be
  # editable-installed into the shared env *first* so this bare-name
  # requirement resolves against it and pip never fetches "traminex" from PyPI
  # (unclaimed name -> dependency-confusion risk). See MIGRATION_PLAN.md 0.3.
  # The bare version floor is insufficient: behavior-bearing source changed
  # without a version bump. Package initialization therefore verifies the
  # installed source against the checked-in 83-file content commitment for
  # revision 2cbb3472736d0ccce32a291241983a12b8921122 (aggregate SHA-256
  # 4a0a7a647903bc6d61bedc824ec35b2e1c4fb74a67e04c5fdd7f9085d2f3d99b;
  # re-pinned 2026-11-07 from 6e76440b and 2026-11-08 to traminex 0.2.1, 0.2.2, then 0.2.3).
  # Editable CI and wheel smoke invoke the same verifier explicitly after an
  # approved TRAMINEX_SOURCE install. See docs/maintainers/README.md for the
  # reviewed manifest-update procedure.
  "traminex>=0.2.0",
]

[project.optional-dependencies]
# Every optional dependency that changes observable behaviour is declared here.
# Finding F-12 of the 2026-08-24 whole-codebase audit found `seaborn`,
# `mplcursors` and `tqdm` declared nowhere while each changed what the package
# did when present, and `threadpoolctl` declared only under `dev`. `fastcluster`
# is deliberately absent: finding F-11 removed the branch that selected it, and
# `weightedcluster._fastcluster_linkage` now reproduces `fastcluster::hclust` in
# Python with no optional package involved.
#
# plot: rendering. matplotlib is required for any figure; seaborn changes the
# rendered style; mplcursors adds hover tooltips to plot_clustassoc and warns
# when absent.
plot = [
  "matplotlib>=3.6",
  "seaborn>=0.13",
  "mplcursors>=0.5",
]
# progress: progress bars for the parallel batch runners. Without it an explicit
# progressbar=True warns and continues (finding F-28).
progress = [
  "tqdm>=4.66",
]
# threads: real limits on already-loaded native thread pools. Without it
# limit_threads sets the environment variables only, and warns.
threads = [
  "threadpoolctl>=3.2",
]
numba = [
  "numba>=0.59",
]
# strict: test-time only. No module under src/ imports sksparse; the sole
# consumers are the CHOLMOD-based REML prototype helper in
# tests/rarcat_reml_architecture.py and its test. CI installs it so that
# prototype stays exercised; installing it changes nothing user-facing.
strict = [
  "scikit-sparse>=0.4.12",
]
bayesian = [
  "pymc>=6.0.1,<6.1.0",
  "arviz>=1.2.0,<1.3.0",
  "arviz-stats[xarray]>=1.2.0,<1.3.0",
  "xarray>=2026.4.0,<2026.5.0",
  "h5netcdf>=1.8.1,<1.9.0",
  "h5py>=3.16.0,<3.17.0",
  "patsy>=1.0.2",
]
dev = [
  "arviz>=1.2.0,<1.3.0",
  "arviz-stats[xarray]>=1.2.0,<1.3.0",
  "bambi>=0.18.0,<0.19.0",
  "black>=24.4",
  "build>=1.2",
  "formulae>=0.6.2,<0.7.0",
  "h5netcdf>=1.8.1,<1.9.0",
  "h5py>=3.16.0,<3.17.0",
  "matplotlib>=3.6",
  "patsy>=1.0.2",
  "pre-commit>=3.7",
  "pymc>=6.0.1,<6.1.0",
  "PyYAML>=6.0",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "rpy2>=3.6",
  "ruff>=0.5",
  "statsmodels>=0.14.6",
  "threadpoolctl>=3.6",
  "xarray>=2026.4.0,<2026.5.0",
]

[tool.scikit-build]
wheel.packages = ["src/weightedcluster"]

[tool.scikit-build.sdist]
include = ["src/weightedcluster/_traminex_compatibility.json"]
exclude = [
  ".coverage*",
  ".github/**",
  "archive/**",
  "audit/**",
  "benchmarks/results/**",
  "dist/**",
  "docs/legacy/**",
  "docs/maintainers/PHASE4_BACKEND_REPORT.md",
  "docs/superpowers/**",
  "graphify-out/**",
  "htmlcov/**",
  "orig_R_pkg/**",
  # Left out of the published package (maintainer's decision of 2026-11-08): the maintainers'
  # records, the Bayesian B1 validation evidence and the test modules that read them. They stay in
  # this repository, where the full suite runs.
  "docs/SUPERVISOR_NOTES.md",
  "docs/maintainers/**",
  "tests/_bayesian_rarcat_b1_*.py",
  "tests/fixtures/bayesian_rarcat_b1_*",
  "tests/test_audit_20260821_truth_surfaces.py",
  "tests/test_audit_20260827_cmpcluster_proptree.py",
  "tests/test_audit_20260827_fuzzy_geometry.py",
  "tests/test_bayesian_rarcat_b1_design_replay_review.py",
  "tests/test_bayesian_rarcat_b1_independent_verification.py",
  "tests/test_bayesian_rarcat_b1_null_diagnostic_recovery_v2.py",
  "tests/test_bayesian_rarcat_b1_null_diagnostic_robustness.py",
  "tests/test_bayesian_rarcat_b1_spike.py",
  "tests/test_bayesian_rarcat_b5_validation.py",
  "tests/test_bayesian_rarcat_public.py",
  "tests/test_docs_release_contracts.py",
  "tests/test_oracle_provenance.py",
  "tests/test_platform_release_contracts.py",
  "tests/test_rarcat_conformance_scaffolding.py",
  "tests/test_rarcat_reml_architecture.py",
  "tests/test_weightedcluster_2_0_contract.py",
]

[tool.pytest.ini_options]
# Deliberately no `addopts`. A configured `-q` combined silently with the `-q`
# that this project's documented commands and CI steps already pass, giving
# `-qq`, which suppresses the "N passed" summary line entirely — so a captured
# log could not support the test count quoted from it. That was finding F-14 of
# the 2026-08-24 whole-codebase audit. Leaving `addopts` unset makes a single
# `-q` behave as written everywhere. Do not reintroduce `-q` here.
minversion = "7.0"
testpaths = ["tests"]

# Numba-compiled function bodies execute as machine code and are not observable
# by coverage.py, so each @njit function in src/weightedcluster/_numba.py is
# excluded with "# pragma: no cover" at its definition. The module's plain
# Python — validators, wrappers, and the range-risk dispatch — stays inside the
# gate: omitting the whole file hid exactly the routing logic where the
# 2026-09-02 audit's one numerical defect lived (finding WC-090208).
[tool.coverage.report]
fail_under = 85

[tool.black]
line-length = 100
target-version = ["py311"]
include = ".*\\.py$"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E203", "E266", "E501"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
